# Sample Render service definitions for deploying the backend and worker.
# Adjust region, plan and branch to your preferences before deploying.

services:
  - type: web
    name: nexustime-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    branch: development
    plan: starter
    startCommand: ./start.sh
    envVars:
      - key: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
      - key: DJANGO_ALLOWED_HOSTS
        value: fyp-brkr.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://fyp-brkr.onrender.com
      - key: POSTGRES_HOST
      - key: POSTGRES_DB
      - key: POSTGRES_USER
      - key: POSTGRES_PASSWORD
      - key: REDIS_URL
    healthCheck:
      path: "/api/"
      protocol: HTTP
      port: 8000
      intervalSeconds: 10
      timeoutSeconds: 5
      unhealthyThreshold: 3

  - type: worker
    name: nexustime-celery
    env: docker
    dockerfilePath: backend/Dockerfile
    branch: development
    plan: starter
    startCommand: celery -A nexustime worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-1}
    envVars:
      - key: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
      - key: POSTGRES_HOST
      - key: POSTGRES_DB
      - key: POSTGRES_USER
      - key: POSTGRES_PASSWORD
      - key: REDIS_URL

databases:
  - name: nexustime-db
    engine: postgres
    plan: starter

# Note: Render will provide a DATABASE_URL environment variable for the Postgres
# instance created above; `dj-database-url` is used to parse it. Set `REDIS_URL`
# to a Redis add-on instance in the Render dashboard and set `DJANGO_SECRET_KEY`.

# Note: Render also provides Redis as a managed service in the dashboard; set REDIS_URL
# environment variable on the services to the Redis instance URL that Render provides.
